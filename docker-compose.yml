services:
  linkpulse:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - JWT_SECRET=change-this-to-a-secure-random-secret
    volumes:
      - linkpulse_data:/app/data
    restart: unless-stopped

volumes:
  linkpulse_data:
